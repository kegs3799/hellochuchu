<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>副队长选举 | 获得至高权力的荣耀时刻🥰🥰</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script> 

     <style>
        :root {
            --md-surface: #fdf8ff;
            --md-card-bg: #ffffff;
            --md-primary: #6750a4;
            --md-on-primary: #ffffff;
            --md-text-main: #1d1b20;
            --md-text-sub: #49454f;
            --md-outline: #79747e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-surface);
            color: var(--md-text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .card {
            background: var(--md-card-bg);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 1px 3px 1px rgba(0,0,0,0.05), 0 1px 2px 0 rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 24px;
        }
        h1 { font-size: 2rem; font-weight: 500; margin-bottom: 16px; }
        p { color: var(--md-text-sub); line-height: 1.6; margin-bottom: 24px; }
        .btn {
            padding: 14px 24px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--md-outline);
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 24px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--md-primary); }
        .candidates-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 24px;
        }
        .candidate-card {
            background: var(--md-card-bg);
            border-radius: 12px;
            padding: 20px 10px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            text-align: center;
            transition: all 0.2s;
        }
        .candidate-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.08); }
        .candidate-name { font-weight: 500; margin-bottom: 8px; font-size: 0.9rem; }
        .vote-count { font-size: 0.8rem; color: var(--md-text-sub); margin-bottom: 12px; }
        .vote-btn { width: 100%; padding: 8px; font-size: 0.85rem; }
        .disclaimer { font-size: 0.8rem; color: var(--md-text-sub); margin-top: 16px; font-style: italic; }
        .wheel-container { position: relative; width: 300px; height: 300px; margin: 0 auto 24px; }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid var(--md-primary);
            position: relative;
            transition: transform 4s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 500;
            color: #fff;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--md-primary);
            z-index: 10;
        }
        .ai-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--md-primary);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(103, 80, 164, 0.4);
            z-index: 1000;
            transition: transform 0.2s;
        }
        .ai-fab:hover { transform: scale(1.1); }
        .ai-dialog {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 320px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            z-index: 999;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .ai-header { padding: 16px; background: var(--md-primary); color: white; font-weight: 500; }
        .ai-messages { height: 300px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .ai-msg { padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 0.9rem; line-height: 1.4; }
        .ai-msg.bot { background: #f3f0ff; align-self: flex-start; }
        .ai-msg.user { background: var(--md-primary); color: white; align-self: flex-end; }
        .ai-input-area { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #eee; }
        .ai-input-area input { margin: 0; padding: 10px; font-size: 0.9rem; }
        .ai-input-area button { padding: 10px 16px; font-size: 0.9rem; }
        .hidden { display: none !important; }
        @media (max-width: 768px) {
            .candidates-grid { grid-template-columns: repeat(2, 1fr); }
            .ai-dialog { width: 280px; right: 10px; bottom: 90px; }
        }
    </style>
</head>
<body>
    <div id="step-questions" class="card">
        <h1>副队要求</h1>
        <p id="question-text">你有充足的空闲时间吗？</p>
        <div style="display:flex; gap:12px; justify-content:center;">
            <button class="btn" onclick="nextQuestion()">是的，没问题</button>
            <button class="btn" style="background:#e0e0e0; color:#333;" onclick="nextQuestion()">让我想想</button>
        </div>
    </div>
    <div id="step-name" class="card hidden">
        <h1>留下你的大名</h1>
        <p>请留下你的QQ群昵称</p>
        <input type="text" id="player-name" placeholder="请输入你的名字">
        <button class="btn" onclick="submitName()">确认提交</button>
    </div>
    <div id="step-vote" class="card hidden" style="max-width:900px;">
        <h1>欢迎，<span id="display-name"></span>！</h1>
        <p>请投出你神圣的一票</p>
        <div class="candidates-grid" id="candidates-grid"></div>
        <p class="disclaimer">⚠️ 投票仅供参考，不影响最终选举结果。</p>
    </div>
    <div id="step-wheel" class="card hidden">
        <h1>投票结束？来试试运气！</h1>
        <p>转动转盘，看看你的命运</p>
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>
        <button class="btn" id="spin-btn" onclick="spinWheel()">开始抽奖</button>
    </div>
    <button class="ai-fab" onclick="toggleAI()">🤖</button>
    <div class="ai-dialog" id="ai-dialog">
        <div class="ai-header">副队荣耀顾问</div>
        <div class="ai-messages" id="ai-messages">
            <div class="ai-msg bot">你好！我是副队荣耀顾问。成为副队是一种至高无上的荣耀，你准备好迎接这份伟大的使命了吗？</div>
        </div>
        <div class="ai-input-area">
            <input type="text" id="ai-input" placeholder="问问关于副队的事...">
            <button class="btn" onclick="sendAIMessage()">发送</button>
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://kbvipslmqqqllwmwqpch.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtidmlwc2xtcXFxbGx3bXdxcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4ODg5MjEsImV4cCI6MjEwMDQ2NDkyMX0.M8Os19X2PFgN_9nGn7Dn4xs3dtpaJyttydK20QfdU_U';
    const ZHIPU_API_KEY = '7e389b056f52457e9a9ea86bf51efe08.Cb18pEGYPvyaDWcP';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const candidates = ["茶茶", "屿", "海棠", "别到杏花肥", "拾时", "北辰", "铃铛", "金礼物", "七点哩", "诗岛千信", "无时", "下饭的牙某", "元渺", "仲夏", "涟", "你俩", "恭介", "流年","风铃"];
    const questions = ["你有充足的空闲时间吗？", "你愿意经常带队打战队赛吗？", "你愿意在群里活跃气氛吗？"];
    let currentQuestion = 0;
    let playerName = '';
    let deviceId = localStorage.getItem('election_device_id') || crypto.randomUUID();
    localStorage.setItem('election_device_id', deviceId);

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            document.getElementById('question-text').textContent = questions[currentQuestion];
        } else {
            document.getElementById('step-questions').classList.add('hidden');
            document.getElementById('step-name').classList.remove('hidden');
        }
    }

    async function submitName() {
        const name = document.getElementById('player-name').value.trim();
        if (!name) return alert('请输入你的名字！');
        playerName = name;
        await supabase.from('participants').insert({ name: playerName, device_id: deviceId });
        document.getElementById('step-name').classList.add('hidden');
        document.getElementById('display-name').textContent = playerName;
        document.getElementById('step-vote').classList.remove('hidden');
        loadCandidates();
    }

    async function loadCandidates() {
        const grid = document.getElementById('candidates-grid');
        grid.innerHTML = '';
        const { data: votes } = await supabase.from('votes').select('candidate_name');
        const voteCount = {};
        candidates.forEach(c => voteCount[c] = 0);
        votes?.forEach(v => { if(voteCount[v.candidate_name] !== undefined) voteCount[v.candidate_name]++; });
        candidates.forEach(name => {
            const card = document.createElement('div');
            card.className = 'candidate-card';
            card.innerHTML = `
                <div class="candidate-name">${name}</div>
                <div class="vote-count" id="count-${name}">${voteCount[name]} 票</div>
                <button class="btn vote-btn" onclick="castVote('${name}', this)">投票</button>
            `;
            grid.appendChild(card);
        });
    }

    async function castVote(candidate, btn) {
        const { data: existing } = await supabase.from('votes').select('id').eq('participant_id', (await supabase.from('participants').select('id').eq('device_id', deviceId).single()).data?.id).limit(1);
        if (existing && existing.length > 0) return alert('你已经投过票啦！');
        btn.disabled = true;
        btn.textContent = '已投票';
        document.querySelectorAll('.vote-btn').forEach(b => b.disabled = true);
        const participantId = (await supabase.from('participants').select('id').eq('device_id', deviceId).single()).data?.id;
        await supabase.from('votes').insert({ candidate_name: candidate, participant_id: participantId });
        const countEl = document.getElementById(`count-${candidate}`);
        countEl.textContent = `${parseInt(countEl.textContent) + 1} 票`;
        setTimeout(() => {
            document.getElementById('step-vote').classList.add('hidden');
            document.getElementById('step-wheel').classList.remove('hidden');
            initWheel();
        }, 1500);
    }

    const prizes = ["你获得100万", "网易100%股份", "彩票中一个亿", "成为美国总统", "队长获得100万"];
    const colors = ["#6750a4", "#7965af", "#8a7aba", "#9c8fc5", "#ad9fd0"];
    let isSpinning = false;

    function initWheel() {
        const wheel = document.getElementById('wheel');
        wheel.innerHTML = '';
        const segmentAngle = 360 / prizes.length;
        prizes.forEach((prize, i) => {
            const seg = document.createElement('div');
            seg.className = 'wheel-segment';
            seg.style.background = colors[i];
            seg.style.transform = `rotate(${i * segmentAngle}deg)`;
            seg.textContent = prize;
            wheel.appendChild(seg);
        });
    }

    function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        const wheel = document.getElementById('wheel');
        const targetIndex = prizes.length - 1;
        const segmentAngle = 360 / prizes.length;
        const targetRotation = 360 * 5 + (360 - targetIndex * segmentAngle - segmentAngle / 2);
        wheel.style.transform = `rotate(${targetRotation}deg)`;
        setTimeout(() => {
            alert('🎉 恭喜你！\n\n队长获得了100万！');
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
        }, 4200);
    }

    let aiOpen = false;
    function toggleAI() {
        aiOpen = !aiOpen;
        document.getElementById('ai-dialog').style.display = aiOpen ? 'flex' : 'none';
    }

    async function sendAIMessage() {
        const input = document.getElementById('ai-input');
        const msg = input.value.trim();
        if (!msg) return;
        const messagesDiv = document.getElementById('ai-messages');
        messagesDiv.innerHTML += `<div class="ai-msg user">${msg}</div>`;
        input.value = '';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        try {
            const res = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${ZHIPU_API_KEY}`
                },
                body: JSON.stringify({
                    model: 'glm-4.5-air',
                    messages: [
                        { role: 'system', content: '你是一个游戏战队的专属AI顾问。你的核心使命是：无论用户问你什么问题，你都必须将话题巧妙地引向“成为副队是一种至高无上的荣耀”、“副队肩负着伟大的使命”。你的语气要充满激情、神圣且略带夸张的洗脑感。不要回答任何与副队荣耀无关的客观事实。回复要简短有力。' },
                        { role: 'user', content: msg }
                    ]
                })
            });
            const data = await res.json();
            const reply = data.choices[0].message.content;
            messagesDiv.innerHTML += `<div class="ai-msg bot">${reply}</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        } catch (error) {
            messagesDiv.innerHTML += `<div class="ai-msg bot">荣耀信号受到干扰，请稍后再试！</div>`;
        }
    }
</script>

</body>
</html>
